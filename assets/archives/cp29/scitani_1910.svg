<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#fcf8ed"/>
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="#292524" stroke-width="2"/>

  <!-- Záhlaví Rakousko-Uhersko 1910 -->
  <g transform="translate(450, 75)" text-anchor="middle" font-family="Georgia, serif">
    <text y="0" font-size="16" font-weight="bold" fill="#78350f" letter-spacing="2">KÖNIGREICHE UND LÄNDER IM REICHSRATE VERTRETEN / MARKGRAFSCHAFT MÄHREN</text>
    <text y="30" font-size="22" font-weight="bold" fill="#1c1917">Volkszählung vom 31. Dezember 1910 / Sčítání lidu 1910</text>
    <text y="54" font-size="14" font-style="italic" fill="#57534e">Bezirkshauptmannschaft Hohenstadt / Okresní hejtmanství Zábřeh</text>
    <text y="74" font-size="15" font-weight="bold" fill="#b45309">Gemeinde Lomigsdorf (Dlouhomilov) – Haus Nr. 29</text>
  </g>

  <!-- Údaje o hospodáři a obyvatelích -->
  <g transform="translate(50, 190)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect x="0" y="0" width="800" height="40" fill="#e7e5e4" stroke="#1c1917"/>
    <text x="20" y="25" font-size="12" font-weight="bold">Zählblatt / Sčítací list čp. 29 – Rodina Josefa Dvořáka (Bauer / Rolník)</text>

    <!-- Položky rodiny -->
    <g transform="translate(0, 40)" font-size="12" fill="#1c1917">
      <rect x="0" y="0" width="800" height="35" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="15" y="22" font-weight="bold">1. Josef Dvořák (*1858)</text>
      <text x="220" y="22">Hospodář (Bauer)</text>
      <text x="400" y="22">katolické</text>
      <text x="520" y="22">česká (böhmisch)</text>
      <text x="680" y="22">čte a píše</text>

      <rect x="0" y="35" width="800" height="35" fill="#fafaf9" stroke="#d6d3d1"/>
      <text x="15" y="57" font-weight="bold">2. Anna Dvořáková (*1862)</text>
      <text x="220" y="57">Manželka</text>
      <text x="400" y="57">katolické</text>
      <text x="520" y="57">česká</text>
      <text x="680" y="57">čte a píše</text>

      <rect x="0" y="70" width="800" height="35" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="15" y="92" font-weight="bold">3. Jan Dvořák (*1886)</text>
      <text x="220" y="92">Syn / Pomocník</text>
      <text x="400" y="92">katolické</text>
      <text x="520" y="92">česká</text>
      <text x="680" y="92">čte a píše</text>

      <rect x="0" y="105" width="800" height="35" fill="#fafaf9" stroke="#d6d3d1"/>
      <text x="15" y="127">4. Františka Dvořáková (*1892)</text>
      <text x="220" y="127">Dcera</text>
      <text x="400" y="127">katolické</text>
      <text x="520" y="127">česká</text>
      <text x="680" y="127">čte a píše</text>

      <rect x="0" y="140" width="800" height="35" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="15" y="162">5. Alois Dvořák (*1896)</text>
      <text x="220" y="162">Syn / Žák</text>
      <text x="400" y="162">katolické</text>
      <text x="520" y="162">česká</text>
      <text x="680" y="162">čte a píše</text>
    </g>
  </g>

  <!-- Stav dobytka -->
  <g transform="translate(50, 440)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect x="0" y="0" width="800" height="120" fill="#fefce8" stroke="#ca8a04" rx="4"/>
    <text x="20" y="28" font-size="12" font-weight="bold" fill="#854d0e">Viehstand / Stav hospodářského zvířectva (1910):</text>
    <text x="40" y="60" font-size="14">🐎 2 koně | 🐄 7 kusů hovězího dobytka | 🐖 3 prasata | 🐔 30 kusů drůbeže</text>
    <text x="20" y="98" font-size="10" fill="#713f12" font-style="italic">Pramen: Zemský archiv v Opavě, fond Okresní hejtmanství Zábřeh, Sčítání 1910.</text>
  </g>

  <!-- Pečeť c.k. hejtmanství -->
  <g transform="translate(450, 750)" text-anchor="middle" font-family="Georgia, serif">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#78350f" stroke-width="2"/>
    <text y="-10" font-size="11" font-weight="bold" fill="#78350f">K. K. BEZIRKSHAUPTMANNSCHAFT</text>
    <text y="10" font-size="11" font-weight="bold" fill="#78350f">HOHENSTADT</text>
    <text y="25" font-size="9" fill="#78350f">1910</text>
  </g>

  <!-- Umístění souboru -->
  <g transform="translate(450, 1140)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="-380" y="-20" width="760" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text y="2" font-size="11" font-weight="bold" fill="#334155">📁 Umístění souboru v projektu: <tspan fill="#b45309">assets/archives/cp29/scitani_1910.jpg</tspan></text>
  </g>
</svg>
