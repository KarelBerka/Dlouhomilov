<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fdfbf7" surfaceScale="1" result="light">
        <feDistantLight azimuth="60" elevation="50"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>
  </defs>

  <!-- Pozadí pergamenu sčítacího archu -->
  <rect width="900" height="1200" fill="#fcf9f2" filter="url(#paper-texture)"/>
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="#292524" stroke-width="2.5"/>
  <rect x="30" y="30" width="840" height="1140" fill="none" stroke="#292524" stroke-width="1"/>

  <!-- Záhlaví archu ČSR 1921 -->
  <g transform="translate(450, 80)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text y="0" font-size="14" font-weight="bold" fill="#78350f" letter-spacing="3">REPUBLIKA ČESKOSLOVENSKÁ</text>
    <text y="32" font-size="24" font-weight="900" fill="#1c1917" font-family="Georgia, serif">SČÍTÁNÍ LIDU ZE DNE 15. ÚNORA 1921</text>
    <text y="58" font-size="13" font-weight="bold" fill="#44403c">SČÍTACÍ ARCH PRO DOMÁCNOSTI A HOSPODÁŘSTVÍ</text>
  </g>

  <!-- Údaje o obci a stavení -->
  <g transform="translate(60, 175)" font-family="monospace" font-size="13" fill="#1c1917">
    <rect x="0" y="0" width="780" height="75" fill="#fef3c7" opacity="0.4" stroke="#d97706" stroke-width="1"/>
    <text x="15" y="25"><tspan font-weight="bold" font-family="sans-serif">Župa / Země:</tspan> Morava</text>
    <text x="260" y="25"><tspan font-weight="bold" font-family="sans-serif">Politický okres:</tspan> Zábřeh</text>
    <text x="530" y="25"><tspan font-weight="bold" font-family="sans-serif">Soudní okres:</tspan> Zábřeh</text>
    <text x="15" y="55"><tspan font-weight="bold" font-family="sans-serif">Obec:</tspan> Dlouhomilov (Lomigsdorf)</text>
    <text x="350" y="55"><tspan font-weight="bold" font-family="sans-serif">Číslo popisné:</tspan> <tspan font-size="18" font-weight="bold" fill="#b45309">29</tspan></text>
    <text x="530" y="55"><tspan font-weight="bold" font-family="sans-serif">Počet bytů:</tspan> 2 (hlavní + výměnek)</text>
  </g>

  <!-- Tabulka obyvatel -->
  <g transform="translate(45, 275)" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <!-- Záhlaví tabulky -->
    <rect x="0" y="0" width="810" height="50" fill="#e7e5e4" stroke="#1c1917" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="50" stroke="#1c1917"/>
    <line x1="220" y1="0" x2="220" y2="50" stroke="#1c1917"/>
    <line x1="330" y1="0" x2="330" y2="50" stroke="#1c1917"/>
    <line x1="430" y1="0" x2="430" y2="50" stroke="#1c1917"/>
    <line x1="530" y1="0" x2="530" y2="50" stroke="#1c1917"/>
    <line x1="680" y1="0" x2="680" y2="50" stroke="#1c1917"/>

    <text x="20" y="30" text-anchor="middle" font-size="11" font-weight="bold">Poř. č.</text>
    <text x="130" y="30" text-anchor="middle" font-size="12" font-weight="bold">Jméno a příjmení</text>
    <text x="275" y="30" text-anchor="middle" font-size="11" font-weight="bold">Příbuzenství</text>
    <text x="380" y="24" text-anchor="middle" font-size="10" font-weight="bold">Narození<tspan x="380" y="38" font-size="9" fill="#78716c">(den, měs., rok)</tspan></text>
    <text x="480" y="30" text-anchor="middle" font-size="11" font-weight="bold">Náboženství</text>
    <text x="605" y="30" text-anchor="middle" font-size="11" font-weight="bold">Povolání / Postavení</text>
    <text x="745" y="30" text-anchor="middle" font-size="11" font-weight="bold">Gramotnost</text>

    <!-- Řádky sčítání (Vzorové přepisy) -->
    <!-- 1. Jan Dvořák -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="810" height="42" fill="#ffffff" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">1</text>
      <text x="50" y="26" font-size="13" font-weight="bold" fill="#1c1917">Jan Dvořák</text>
      <text x="230" y="26" font-size="12">hospodář</text>
      <text x="340" y="26" font-size="12">12. 5. 1886</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11" font-weight="bold">samostatný rolník</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>

    <!-- 2. Marie Dvořáková -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="810" height="42" fill="#fafaf9" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">2</text>
      <text x="50" y="26" font-size="13" font-weight="bold" fill="#1c1917">Marie Dvořáková</text>
      <text x="230" y="26" font-size="12">manželka</text>
      <text x="340" y="26" font-size="12">4. 9. 1891</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11">v hospodářství</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>

    <!-- 3. Josef Dvořák -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="810" height="42" fill="#ffffff" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">3</text>
      <text x="50" y="26" font-size="13" fill="#1c1917">Josef Dvořák</text>
      <text x="230" y="26" font-size="12">syn</text>
      <text x="340" y="26" font-size="12">18. 8. 1914</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11">školák</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>

    <!-- 4. Marie Dvořáková ml. -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="810" height="42" fill="#fafaf9" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">4</text>
      <text x="50" y="26" font-size="13" fill="#1c1917">Marie Dvořáková</text>
      <text x="230" y="26" font-size="12">dcera</text>
      <text x="340" y="26" font-size="12">2. 1. 1917</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11">dítě</text>
      <text x="690" y="26" font-size="11">-</text>
    </g>

    <!-- 5. Josef Dvořák st. (výměnkář) -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="810" height="42" fill="#ffffff" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">5</text>
      <text x="50" y="26" font-size="13" font-weight="bold" fill="#1c1917">Josef Dvořák</text>
      <text x="230" y="26" font-size="12">otec (výměnkář)</text>
      <text x="340" y="26" font-size="12">22. 3. 1858</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11" font-weight="bold">výměnkář</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>

    <!-- 6. Anna Dvořáková -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="810" height="42" fill="#fafaf9" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">6</text>
      <text x="50" y="26" font-size="13" fill="#1c1917">Anna Dvořáková</text>
      <text x="230" y="26" font-size="12">matka (výměnkářka)</text>
      <text x="340" y="26" font-size="12">10. 11. 1862</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11">výměnkářka</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>

    <!-- 7. František Kolář -->
    <g transform="translate(0, 302)">
      <rect x="0" y="0" width="810" height="42" fill="#ffffff" stroke="#a8a29e" stroke-width="0.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="12">7</text>
      <text x="50" y="26" font-size="13" fill="#1c1917">František Kolář</text>
      <text x="230" y="26" font-size="12">čeledín</text>
      <text x="340" y="26" font-size="12">15. 6. 1902</text>
      <text x="440" y="26" font-size="11">římskokat.</text>
      <text x="540" y="26" font-size="11">zemědělský dělník</text>
      <text x="690" y="26" font-size="11">čte i píše</text>
    </g>
  </g>

  <!-- Soupis domácího zvířectva -->
  <g transform="translate(45, 660)" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="0" y="0" width="810" height="160" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" rx="6"/>
    <text x="20" y="30" font-size="13" font-weight="bold" fill="#854d0e">HOSPODÁŘSKÉ ZVÍŘECTVO (čp. 29, Dlouhomilov)</text>
    
    <g transform="translate(30, 50)" font-size="12" fill="#1c1917">
      <rect x="0" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="55" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">2</text>
      <text x="55" y="58" text-anchor="middle" font-size="11" font-weight="bold">Koně</text>

      <rect x="130" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="185" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">6</text>
      <text x="185" y="58" text-anchor="middle" font-size="11" font-weight="bold">Skot (krávy)</text>

      <rect x="260" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="315" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">4</text>
      <text x="315" y="58" text-anchor="middle" font-size="11" font-weight="bold">Prasata</text>

      <rect x="390" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="445" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">0</text>
      <text x="445" y="58" text-anchor="middle" font-size="11" font-weight="bold">Kozy</text>

      <rect x="520" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="575" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">25</text>
      <text x="575" y="58" text-anchor="middle" font-size="11" font-weight="bold">Drůbež</text>

      <rect x="650" y="0" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="705" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">3</text>
      <text x="705" y="58" text-anchor="middle" font-size="11" font-weight="bold">Včelí úly</text>
    </g>
    <text x="20" y="145" font-size="10" fill="#713f12" font-style="italic">Pramen: Fond Okresní úřad Zábřeh, Sčítání lidu 1921, obec Dlouhomilov, arch čp. 29.</text>
  </g>

  <!-- Úřední razítko a podpis sčítacího komisaře -->
  <g transform="translate(60, 870)" font-family="Georgia, serif">
    <circle cx="120" cy="110" r="55" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="120" cy="110" r="45" fill="none" stroke="#1e3a8a" stroke-width="1"/>
    <text x="120" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">OBECNÍ ÚŘAD</text>
    <text x="120" y="120" text-anchor="middle" font-size="9" fill="#1e3a8a">DLOUHOMILOV</text>

    <!-- Podpisy -->
    <g transform="translate(320, 90)" font-size="13" fill="#1c1917">
      <text x="0" y="0">Podpis hlavy domácnosti:</text>
      <text x="220" y="-2" font-family="'Brush Script MT', cursive, serif" font-size="20" fill="#0f172a">Jan Dvořák</text>
      <line x1="200" y1="5" x2="420" y2="5" stroke="#475569" stroke-width="1"/>

      <text x="0" y="50">Podpis sčítacího komisaře:</text>
      <text x="220" y="48" font-family="'Brush Script MT', cursive, serif" font-size="19" fill="#0f172a">Josef Hecl v. r.</text>
      <line x1="200" y1="55" x2="420" y2="55" stroke="#475569" stroke-width="1"/>
    </g>
  </g>

  <!-- Patička s instrukcí k uložení reálného skenu -->
  <g transform="translate(450, 1140)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="-380" y="-20" width="760" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text y="2" font-size="11" font-weight="bold" fill="#334155">📁 Umístění souboru v projektu: <tspan fill="#b45309">assets/archives/cp29/scitani_1921.jpg</tspan> (nebo .png)</text>
  </g>
</svg>
