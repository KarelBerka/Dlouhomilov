<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#fbf5e6"/>
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="#44403c" stroke-width="2"/>

  <!-- Záhlaví 1869 -->
  <g transform="translate(450, 80)" text-anchor="middle" font-family="Georgia, serif">
    <text y="0" font-size="16" font-weight="bold" fill="#78350f">CÍSAŘSTVÍ RAKOUSKÉ / VÉVODSTVÍ A MARKRABSTVÍ MORAVSKÉ</text>
    <text y="34" font-size="24" font-weight="bold" fill="#1c1917">Sčítání lidu ze dne 31. prosince 1869</text>
    <text y="60" font-size="14" fill="#57534e">Okresní hejtmanství Zábřeh – Místní obec Dlouhomilov (Lomigsdorf)</text>
    <text y="85" font-size="16" font-weight="bold" fill="#b45309">Dům čp. 29 (Selský grunt rodu Dvořáků)</text>
  </g>

  <!-- Obyvatelé 1869 -->
  <g transform="translate(50, 210)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
    <rect x="0" y="0" width="800" height="35" fill="#e7e5e4" stroke="#1c1917"/>
    <text x="20" y="22" font-weight="bold">Archivní zápis sčítacího operátu 1869:</text>

    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="800" height="35" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="15" y="22" font-weight="bold">1. František Dvořák (*1826)</text>
      <text x="220" y="22">Hlava rodiny / Sedlák (Bauer)</text>
      <text x="440" y="22">katolík</text>
      <text x="560" y="22">čte i píše</text>

      <rect x="0" y="35" width="800" height="35" fill="#fafaf9" stroke="#d6d3d1"/>
      <text x="15" y="57" font-weight="bold">2. Maria Dvořáková (*1830)</text>
      <text x="220" y="57">Manželka / Hospodyně</text>
      <text x="440" y="57">katolička</text>
      <text x="560" y="57">čte</text>

      <rect x="0" y="70" width="800" height="35" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="15" y="92">3. Josef Dvořák (*1858)</text>
      <text x="220" y="92">Syn / Dítě</text>
      <text x="440" y="92">katolík</text>
      <text x="560" y="92">čte</text>

      <rect x="0" y="105" width="800" height="35" fill="#fafaf9" stroke="#d6d3d1"/>
      <text x="15" y="127">4. Františka Dvořáková (*1863)</text>
      <text x="220" y="127">Dcera</text>
      <text x="440" y="127">katolička</text>
      <text x="560" y="127">-</text>
    </g>
  </g>

  <!-- Dobytčí soupis 1869 -->
  <g transform="translate(50, 420)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect x="0" y="0" width="800" height="90" fill="#fefce8" stroke="#ca8a04" rx="4"/>
    <text x="20" y="28" font-size="12" font-weight="bold" fill="#854d0e">Soupis domácího zvířectva (1869):</text>
    <text x="40" y="56" font-size="14">🐎 1 kůň | 🐄 4 kusy hovězího | 🐖 2 prasata | 🐝 2 včelí úly</text>
  </g>

  <!-- Umístění souboru -->
  <g transform="translate(450, 1140)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="-380" y="-20" width="760" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text y="2" font-size="11" font-weight="bold" fill="#334155">📁 Umístění souboru v projektu: <tspan fill="#b45309">assets/archives/cp29/scitani_1869.jpg</tspan></text>
  </g>
</svg>
