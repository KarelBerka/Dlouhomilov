<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#ffffff"/>
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Záhlaví evidenčního listu památky -->
  <g transform="translate(50, 65)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect width="800" height="75" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">NÁRODNÍ PAMÁTKOVÝ ÚSTAV – STÁTNÍ PAMÁTKOVÁ PÉČE</text>
    <text x="20" y="55" font-size="14" font-weight="bold" fill="#b91c1c">EVIDENČNÍ LIST NEMOVITÉ KULTURNÍ PAMÁTKY (IISPP MIS ID: 1139925)</text>
  </g>

  <!-- Údaje o objektu -->
  <g transform="translate(50, 160)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#1e293b">
    <rect width="800" height="130" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="20" y="28"><strong>Název:</strong> Venkovská usedlost čp. 29</text>
    <text x="450" y="28"><strong>Rejstříkové číslo ÚSKP:</strong> 21975/8-870</text>
    <text x="20" y="58"><strong>Kraj:</strong> Olomoucký | <strong>Okres:</strong> Šumperk | <strong>Obec:</strong> Dlouhomilov</text>
    <text x="450" y="58"><strong>Katalogové číslo:</strong> 534966</text>
    <text x="20" y="88"><strong>Datace vzniku:</strong> 1. polovina 19. století (letopočet 1834)</text>
    <text x="450" y="88"><strong>Druh památky:</strong> Lidová architektura</text>
    <text x="20" y="115"><strong>Původní vlastník:</strong> Selský rod Dvořáků</text>
  </g>

  <!-- Popis a schéma dispozice -->
  <g transform="translate(50, 310)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect width="800" height="360" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="30" font-size="13" font-weight="bold" fill="#0f172a">STAVEBNĚ-HISTORICKÝ POPIS &amp; DISPOZICE:</text>
    <text x="20" y="60" font-size="12" fill="#334155" width="760">
      Volně stojící venkovská usedlost tvořící uzavřený dvůr v centrální části památkové zóny. 
    </text>
    <text x="20" y="85" font-size="12" fill="#334155">
      Obytné stavení je přízemní se zděným a částečně dřevěným traktem, trojosým štítem s nikou.
    </text>
    <text x="20" y="110" font-size="12" fill="#334155">
      V interiéru jsou dochovány plackové a valené klenby s výsečemi a trámové stropy s překladem.
    </text>

    <!-- Kreslený náčrt půdorysu -->
    <g transform="translate(250, 140)">
      <rect x="0" y="0" width="180" height="80" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="90" y="45" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Světnice &amp; Síň</text>

      <rect x="0" y="80" width="80" height="90" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="40" y="130" font-size="10" fill="#78350f" text-anchor="middle">Chlévy</text>

      <rect x="100" y="100" width="160" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="180" y="140" font-size="10" fill="#78350f" text-anchor="middle">Stodola / Mlat</text>

      <text x="140" y="200" font-size="10" font-style="italic" fill="#64748b" text-anchor="middle">Dispoziční schéma selského dvora čp. 29</text>
    </g>
  </g>

  <!-- Fotodokumentace -->
  <g transform="translate(50, 690)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect width="800" height="420" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="30" font-size="13" font-weight="bold" fill="#0f172a">ARCHIVNÍ FOTODOKUMENTACE (IISPP MIS):</text>

    <!-- Rámec pro fotografii -->
    <g transform="translate(200, 60)">
      <rect width="400" height="280" fill="#e2e8f0" stroke="#94a3b8" rx="4"/>
      <text x="200" y="130" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">📸 Historický snímek štítu usedlosti čp. 29</text>
      <text x="200" y="160" font-size="12" fill="#64748b" text-anchor="middle">NPÚ MIS ID 1139925</text>
    </g>
  </g>

  <!-- Umístění souboru -->
  <g transform="translate(450, 1140)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="-380" y="-20" width="760" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text y="2" font-size="11" font-weight="bold" fill="#334155">📁 Umístění souboru v projektu: <tspan fill="#b45309">assets/archives/cp29/evidencni_list_iispp.jpg</tspan></text>
  </g>
</svg>
