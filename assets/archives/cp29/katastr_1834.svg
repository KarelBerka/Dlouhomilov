<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#f5eedc"/>
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="#78350f" stroke-width="2"/>

  <g transform="translate(450, 75)" text-anchor="middle" font-family="Georgia, serif">
    <text y="0" font-size="16" font-weight="bold" fill="#78350f">KÖNIGREICH BÖHMEN &amp; MARKGRAFSCHAFT MÄHREN</text>
    <text y="32" font-size="22" font-weight="bold" fill="#1c1917">STABILNÍ KATASTR (1834) – CÍSAŘSKÝ POVINNÝ OTISK</text>
    <text y="58" font-size="14" fill="#57534e">Katastrální obec Lomigsdorf (Dlouhomilov) – Signatura MOR102618340</text>
  </g>

  <!-- Výřez mapy s parcelou st. 38 -->
  <g transform="translate(150, 180)">
    <rect width="600" height="500" fill="#fef9c3" stroke="#78350f" stroke-width="2" rx="8"/>
    
    <!-- Cesta -->
    <path d="M 50 0 Q 300 250 550 500" fill="none" stroke="#d97706" stroke-width="24" opacity="0.3"/>
    
    <!-- Parcela st. 38 (Usedlost čp. 29) -->
    <g transform="translate(240, 180)">
      <!-- Zděné obytné stavení (červená) -->
      <rect x="0" y="0" width="110" height="55" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
      <text x="55" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">29</text>
      
      <!-- Dřevěné chlévy (žlutá) -->
      <rect x="0" y="55" width="45" height="75" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      
      <!-- Stodola (žlutá) -->
      <rect x="60" y="80" width="105" height="50" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

      <text x="130" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#78350f">st. 38</text>
    </g>

    <!-- Legenda katastru -->
    <g transform="translate(20, 420)" font-family="sans-serif" font-size="11" fill="#1c1917">
      <rect x="0" y="0" width="16" height="16" fill="#dc2626" stroke="#991b1b"/>
      <text x="25" y="13">Zděná nespalná stavba (červená)</text>

      <rect x="230" y="0" width="16" height="16" fill="#f59e0b" stroke="#b45309"/>
      <text x="255" y="13">Dřevěná spalná stavba (žlutá)</text>
    </g>
  </g>

  <!-- Výpis z parcelního protokolu -->
  <g transform="translate(50, 720)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect width="800" height="240" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
    <text x="25" y="35" font-size="14" font-weight="bold" fill="#0f172a">VÝPIS Z PARCELNÍHO PROTOKOLU (1834):</text>
    <text x="25" y="65" font-size="13" fill="#334155"><strong>Katastrální obec:</strong> Lomigsdorf (Dlouhomilov) | <strong>Kraj:</strong> Olomoucký | <strong>Panství:</strong> Zábřeh</text>
    <text x="25" y="95" font-size="13" fill="#334155"><strong>Stavební parcela:</strong> st. 38 (dům čp. 29)</text>
    <text x="25" y="125" font-size="13" fill="#334155"><strong>Jméno majitele:</strong> <tspan font-weight="bold" fill="#b45309">Franz Dworzak (František Dvořák)</tspan>, Rustikal-Besitzer</text>
    <text x="25" y="155" font-size="13" fill="#334155"><strong>Popis:</strong> Obytný dům ze zděného a dřevěného materiálu, chlévy a stodola.</text>
    <text x="25" y="185" font-size="13" fill="#334155"><strong>Přináležející pozemky:</strong> orná půda, pastviny a zahrada.</text>
    <text x="25" y="218" font-size="10" fill="#64748b" font-style="italic">Pramen: Ústřední archiv zeměměřictví a katastru (ÚAZK ČÚZK), Císařské otisky 1834, sign. MOR102618340.</text>
  </g>

  <!-- Umístění souboru -->
  <g transform="translate(450, 1140)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="-380" y="-20" width="760" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text y="2" font-size="11" font-weight="bold" fill="#334155">📁 Umístění souboru v projektu: <tspan fill="#b45309">assets/archives/cp29/katastr_1834.jpg</tspan></text>
  </g>
</svg>
