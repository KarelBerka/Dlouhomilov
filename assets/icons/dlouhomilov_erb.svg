<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Znak obce Dlouhomilov a Benkov">
  <title>Znak obce Dlouhomilov (REKOS č. 37/2004)</title>
  <defs>
    <!-- Tvar gotického štítu -->
    <clipPath id="shield-clip">
      <path d="M 10,8 L 190,8 L 190,115 C 190,178 152,220 100,234 C 48,220 10,178 10,115 Z" />
    </clipPath>
    <clipPath id="left-half">
      <rect x="0" y="0" width="100" height="240" />
    </clipPath>
    <clipPath id="right-half">
      <rect x="100" y="0" width="100" height="240" />
    </clipPath>
    <!-- Definice zkřížených rýčů pro opačné barvy (vlevo červené, vpravo stříbrné/bílé) -->
    <g id="crossed-spades">
      <!-- Rýč 1: čepel vlevo nahoře, násada vpravo dole -->
      <g transform="translate(100,118) rotate(-33)">
        <!-- Násada -->
        <path d="M -5,-35 L 5,-35 L 4,96 C 4,100 -4,100 -4,96 Z" stroke="#1c1917" stroke-width="2.6" stroke-linejoin="round" />
        <!-- Čepel rýče -->
        <path d="M -32,-32 L 32,-32 C 34,-68 22,-98 0,-112 C -22,-98 -34,-68 -32,-32 Z" stroke="#1c1917" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Tulej rýče -->
        <path d="M -7,-25 L 7,-25 L 5,-48 L 0,-64 L -5,-48 Z" stroke="#1c1917" stroke-width="2.2" stroke-linejoin="round" />
      </g>
      <!-- Rýč 2: čepel vpravo nahoře, násada vlevo dole -->
      <g transform="translate(100,118) rotate(33)">
        <!-- Násada -->
        <path d="M -5,-35 L 5,-35 L 4,96 C 4,100 -4,100 -4,96 Z" stroke="#1c1917" stroke-width="2.6" stroke-linejoin="round" />
        <!-- Čepel rýče -->
        <path d="M -32,-32 L 32,-32 C 34,-68 22,-98 0,-112 C -22,-98 -34,-68 -32,-32 Z" stroke="#1c1917" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Tulej rýče -->
        <path d="M -7,-25 L 7,-25 L 5,-48 L 0,-64 L -5,-48 Z" stroke="#1c1917" stroke-width="2.2" stroke-linejoin="round" />
      </g>
    </g>
    <!-- Pětilistý jabloňový květ -->
    <g id="apple-blossom">
      <g stroke="#1c1917" stroke-width="2.2" stroke-linejoin="round">
        <path d="M 0,0 C -10,-8 -14,-20 0,-27 C 14,-20 10,-8 0,0 Z" transform="rotate(0)" />
        <path d="M 0,0 C -10,-8 -14,-20 0,-27 C 14,-20 10,-8 0,0 Z" transform="rotate(72)" />
        <path d="M 0,0 C -10,-8 -14,-20 0,-27 C 14,-20 10,-8 0,0 Z" transform="rotate(144)" />
        <path d="M 0,0 C -10,-8 -14,-20 0,-27 C 14,-20 10,-8 0,0 Z" transform="rotate(216)" />
        <path d="M 0,0 C -10,-8 -14,-20 0,-27 C 14,-20 10,-8 0,0 Z" transform="rotate(288)" />
      </g>
      <!-- Zlatý střed -->
      <circle cx="0" cy="0" r="6.2" fill="#facc15" stroke="#1c1917" stroke-width="2" />
    </g>
  </defs>

  <!-- Vnitřek štítu -->
  <g clip-path="url(#shield-clip)">
    <!-- Stříbrno-červeně polcené pole -->
    <rect x="0" y="0" width="100" height="240" fill="#ffffff" />
    <rect x="100" y="0" width="100" height="240" fill="#dc2626" />
    <line x1="100" y1="8" x2="100" y2="234" stroke="#1c1917" stroke-width="1.5" />

    <!-- Zkřížené rýče opačných barev: v levé polovině červené, v pravé polovině bílé -->
    <g clip-path="url(#left-half)" fill="#dc2626">
      <use href="#crossed-spades" />
    </g>
    <g clip-path="url(#right-half)" fill="#ffffff">
      <use href="#crossed-spades" />
    </g>

    <!-- Jabloňový květ vlevo (červený se zlatým středem) -->
    <g transform="translate(46, 134)" fill="#dc2626">
      <use href="#apple-blossom" />
    </g>

    <!-- Jabloňový květ vpravo (stříbrný/bílý se zlatým středem) -->
    <g transform="translate(154, 134)" fill="#ffffff">
      <use href="#apple-blossom" />
    </g>

    <!-- Zlaté krojidlo přeložené uprostřed (obrácené heraldicky doleva = doprava z pohledu diváka) -->
    <path d="M 86,21 L 112,21 L 101,60 L 112,60 L 115,180 C 115,202 118,215 122,224 C 102,217 87,194 87,156 Z"
          fill="#fde047" stroke="#1c1917" stroke-width="2.8" stroke-linejoin="round" />
  </g>

  <!-- Obrys gotického štítu -->
  <path d="M 10,8 L 190,8 L 190,115 C 190,178 152,220 100,234 C 48,220 10,178 10,115 Z"
        fill="none" stroke="#1c1917" stroke-width="4.5" stroke-linejoin="round" />
</svg>
